        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /initiative-options:
    get:
      summary: Get initiative options
      parameters:
        - name: initiativeId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of initiative options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InitiativeOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create initiative option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiativeOption'
      responses:
        '201':
          description: Initiative option created
          content:
            application/json:
              schema:
