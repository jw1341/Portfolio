        '403':
          $ref: '#/components/responses/Forbidden'
  /office-candidates:
    get:
      summary: Get office candidates
      parameters:
        - name: officeId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of office candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficeCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add candidate to office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeCandidate'
      responses:
        '201':
          description: Candidate added to office
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
