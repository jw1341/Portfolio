        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /initiatives:
    get:
      summary: Get initiatives
      responses:
        '200':
          description: List of initiatives
          content:
            application/json:
              schema:
                type: array
                items:
